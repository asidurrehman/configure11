# Conda environment for CONFIGURE v1.1
#   conda env create -f environment.yaml
#   conda activate configure
# Keep the version limits in step with requirements.txt.
name: configure
channels:
  - conda-forge
dependencies:
  - python=3.10
  - numpy>=1.23
  - pandas>=1.5,<3
  - geopandas>=0.12
  - shapely>=2.0,<3
  - rtree>=1.0
  - matplotlib>=3.6
  - pyyaml>=6.0
  # optional: to run the tests
  - pytest
